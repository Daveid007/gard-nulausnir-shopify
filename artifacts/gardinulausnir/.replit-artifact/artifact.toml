kind = "web"
previewPath = "/gardinulausnir/"
title = "Gardínulausnir.is"
description = "The approved Gardínulausnir.is storefront with collection browsing and configurable roller and honeycomb product pages."
version = "1.0.0"
id = "artifacts/gardinulausnir"
router = "path"

[[services]]
name = "web"
paths = [ "/gardinulausnir/" ]
localPort = 18611

[services.development]
run = "pnpm --filter @workspace/gardinulausnir run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/gardinulausnir", "run", "build" ]
serve = "static"
publicDir = "artifacts/gardinulausnir/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18611"
BASE_PATH = "/gardinulausnir/"
